[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-skill"
version = "0.1.0"
description = "Hardware-free dry-run calibration skill CLI and contracts."
readme = "README.en.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
calibration-skill = "calibration_skill.cli:main"

[tool.setuptools.packages.find]
include = ["calibration_skill*"]

[tool.setuptools.package-data]
calibration_skill = [
    "schemas/v1/*.schema.json",
    "skill/manifest.schema.json"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
